textarea{min-height:80px}

label{display:block;margin:12px 0 4px;color:var(--sub);font-size:14px}
.chk{display:flex;align-items:center;min-height:44px;margin:4px 0;color:var(--tx);font-size:16px}
.muted{color:var(--sub);font-size:14px}
summary{min-height:44px;display:flex;align-items:center;cursor:pointer}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl=s=>esc(s).replace(/\n/g,'<br>');
const offDays=()=>+localStorage.getItem(OFF)||0;
const now=()=>Date.now()+offDays()*864e5;
const norm=s=>String(s||'').toLowerCase().replace(/[〜~…]/g,' ').replace(/\s+/g,' ').trim();
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let state,gist={},tab='search',listFilter={folder:'all',status:'all',tag:'all',hide:false},quiz=null,syncTimer=null,syncing=false,ctx=[],lastErr='';
try{gist=JSON.parse(localStorage.getItem(GKEY))||{}}catch(e){}

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2600)}
function load(){
  try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  state=state||{items:{},status:{},deleted:{}};
  for(const s of SAMPLE) if(!state.items[s.id]&&!state.deleted[s.id]) state.items[s.id]={...s,folder:'sample',updatedAt:0};
  save(false);
}
function save(sync=true){localStorage.setItem(KEY,JSON.stringify(state));if(sync)scheduleSync()}
const items=()=>Object.values(state.items).sort((a,b)=>a.phrase.localeCompare(b.phrase));
const st=id=>state.status[id]?.s||'new';
const LABEL={ok:'覚えた',weak:'あやしい',new:'未学習'};
const groups=()=>[...new Set(items().map(i=>i.group).filter(Boolean))].sort();
const tags=()=>[...new Set(items().flatMap(i=>i.tags||[]))].sort();
function setStatus(id,s){const o=state.status[id]||{};const n=s==='ok'?Math.min((o.s==='ok'?(o.n||0):0)+1,IV.length-1):0;state.status[id]={s,t:now(),n};save()}
const due=id=>{const o=state.status[id];if(!o||o.s!=='ok')return true;return now()-o.t>=IV[o.n||1]};
const dueCount=()=>items().filter(i=>st(i.id)==='weak'||(st(i.id)==='ok'&&due(i.id))).length;

function search(q){
  const n=norm(q);if(!n)return[];const toks=n.split(' ');
  return items().map(it=>{const p=norm(it.phrase);const hay=[p,norm(it.meaning),norm((it.tags||[]).join(' ')),norm(it.group),norm((it.examples||[]).join(' '))].join(' ');
    if(!toks.every(t=>hay.includes(t)))return null;
    return{it,sc:p===n?0:p.startsWith(n)?1:p.includes(n)?2:3}}).filter(Boolean).sort((a,b)=>a.sc-b.sc).map(x=>x.it);
}
const row=(it,hide)=>`<button class="row" data-id="${esc(it.id)}"><span><b>${esc(it.phrase)}</b><small>${hide?'（タップで確認）':esc(it.meaning)}</small></span><span class="badge ${st(it.id)}">${LABEL[st(it.id)]}</span></button>`;
function lookupLinks(q){const e=encodeURIComponent(q);const c=encodeURIComponent(q.trim().toLowerCase().replace(/\s+/g,'-'));
  return `<div class="bar"><a class="btn" target="_blank" rel="noopener" href="https://ejje.weblio.jp/content/${e}">Weblio</a><a class="btn" target="_blank" rel="noopener" href="https://eow.alc.co.jp/search?q=${e}">英辞郎</a><a class="btn" target="_blank" rel="noopener" href="https://dictionary.cambridge.org/dictionary/english/${c}">Cambridge</a><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent(q+' 意味 前置詞 イメージ 語源')}">Google</a></div>`}

function renderSearch(){
  const q=$('#q').value.trim();
  if(!q){const w=items().filter(i=>st(i.id)==='weak');ctx=w.map(i=>i.id);const dc=dueCount();
    return `<div class="card"><h3>今日の復習</h3><p>${dc}件（あやしい＋期限が来た「覚えた」）</p><div class="bar"><button class="btn pri" data-act="quiz" data-mode="today" data-dir="en">英→意味で復習</button><button class="btn" data-act="quiz" data-mode="today" data-dir="cloze">穴埋めで復習</button></div></div>
    <p class="muted">英語・日本語・例文の語で検索できます。見つからなければその場で追加できます。</p><div class="bar"><button class="btn" data-act="new">＋ 新規追加</button></div>`+(w.length?`<h3>あやしい（${w.length}）</h3>`+w.map(i=>row(i)).join(''):'');}
  const r=search(q);ctx=r.map(i=>i.id);
  return `<p class="muted">${r.length}件</p>`+r.map(i=>row(i)).join('')+`<div class="card"><h3>${r.length?'ほかの辞書でも調べる':'見つかりません'}：「${esc(q)}」</h3>${lookupLinks(q)}<div class="bar"><button class="btn pri" data-act="new" data-q="${esc(q)}">「${esc(q)}」を追加</button><button class="btn" data-act="prompt" data-q="${esc(q)}">AI用の質問文をコピー</button></div></div>`;
}
function renderList(){
  const f=listFilter;
  const arr=items().filter(i=>(f.folder==='all'||i.folder===f.folder)&&(f.status==='all'||st(i.id)===f.status)&&(f.tag==='all'||(i.tags||[]).includes(f.tag)));
  ctx=arr.map(i=>i.id);
  const sel=(k,o)=>`<select data-filter="${k}">${o.map(([v,l])=>`<option value="${esc(v)}"${f[k]===v?' selected':''}>${esc(l)}</option>`).join('')}</select>`;
  return `<div class="grid">${sel('folder',[['all','すべてのフォルダ'],['sample','サンプル（800点以上向け）'],['my','マイイディオム']])}${sel('status',[['all','すべての状態'],['new','未学習'],['weak','あやしい'],['ok','覚えた']])}${sel('tag',[['all','すべてのタグ'],...tags().map(t=>[t,t])])}</div>

}
function renderCompare(){
  const gs=groups().map(g=>[g,items().filter(i=>i.group===g)]).filter(([,a])=>a.length>1);
  ctx=gs.flatMap(([,a])=>a.map(i=>i.id));
  if(!gs.length)return '<p class="muted">比較できるグループがまだありません。編集画面で「比較グループ」を同じ名前にすると、ここに並びます。</p>';
  return gs.map(([g,a])=>`<div class="card"><h3>${esc(g)}（${a.length}）</h3><div class="grid">${a.map(i=>`<button class="row" style="flex-direction:column" data-id="${esc(i.id)}"><b>${esc(i.phrase)}</b><small>${esc(i.meaning)}</small><small class="weak">${esc(i.pitfalls||'')}</small></button>`).join('')}</div></div>`).join('');
}
function cloze(it){
  const ex=(it.examples||[])[0];if(!ex)return null;
  const m=ex.match(/^(.*?)\s*（(.*)）\s*$/);const en=m?m[1]:ex,hint=m?m[2]:'';
  const re=it.phrase.split(/\s+/).map((w,i)=>{
    if(/^one'?s$/i.test(w))return '\\S+';
    if(/^[AB]$/.test(w))return '\\S+';
    if(w==='-ing')return '\\S+ing';
    if(w==='be')return '(?:be|is|are|was|were|been|being|am)(?:\\s+not)?';
    const e=w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    return i===0&&w.length>3?e.replace(/(e|y)$/,'')+'\\w*':e;
  }).join('\\s+');
  let r;try{r=new RegExp('\\b'+re+'\\b','i')}catch(e){return null}
  if(!r.test(en))return null;
  return{q:en.replace(r,'＿＿＿＿'),hint};
}
function renderQuiz(){
  if(!quiz){const c=s=>items().filter(i=>st(i.id)===s).length;
    return `<div class="card"><h3>出題（最大20問）</h3><p class="muted">今日の復習 ${dueCount()} ／ 未学習 ${c('new')} ／ あやしい ${c('weak')} ／ 覚えた ${c('ok')}</p><label>出題形式</label><select id="qdir"><option value="en">英語 → 意味</option><option value="ja">意味 → 英語</option><option value="cloze">穴埋め（Part 5風）</option></select><div class="bar"><button class="btn pri" data-act="quiz" data-mode="today">今日の復習</button><button class="btn" data-act="quiz" data-mode="weak">あやしいだけ</button><button class="btn" data-act="quiz" data-mode="new">未学習だけ</button><button class="btn" data-act="quiz" data-mode="all">全部</button></div><p class="muted">「覚えた」は 1→3→7→14→30→60日の間隔で再出題されます。</p></div>`;}
  if(quiz.i>=quiz.q.length)return `<div class="card"><div class="big">おつかれさま</div><p>覚えた ${quiz.okN} ／ あやしい ${quiz.weakN}</p><div class="bar"><button class="btn pri" data-act="quizEnd">終了</button></div></div>`;
  const it=state.items[quiz.q[quiz.i]];if(!it){quiz.i++;return renderQuiz()}
  const cz=quiz.dir==='cloze'?cloze(it):null;const dir=quiz.dir==='cloze'&&!cz?'en':quiz.dir;
  let front;
  if(cz)front=`<p class="muted">空所に入る表現は？</p><div class="cloze">${esc(cz.q)}</div>${cz.hint?`<p class="muted">${esc(cz.hint)}</p>`:''}`;
  else if(dir==='en')front=`<div class="big">${esc(it.phrase)}</div>`;
  else front=`<div class="big" style="font-size:22px">${esc(it.meaning)}</div>`;
  const back=(dir==='en'&&!cz?`<p><b>${esc(it.meaning)}</b></p>`:`<div class="big">${esc(it.phrase)}</div><p>${esc(it.meaning)}</p>`)+(it.image?`<p class="muted">イメージ：${esc(it.image)}</p>`:'')+(!cz&&it.examples?.[0]?`<p>${esc(it.examples[0])}</p>`:'')+(it.pitfalls?`<p class="weak">注意：${esc(it.pitfalls)}</p>`:'');
  return `<p class="muted">${quiz.i+1} / ${quiz.q.length}</p><div class="card">${front}${quiz.shown?'<hr style="border:0;border-top:1px solid var(--bd)">'+back:''}</div><div class="bar">${quiz.shown?`<button class="btn" style="flex:1;color:var(--ok)" data-act="ans" data-s="ok">覚えた</button><button class="btn" style="flex:1;color:var(--weak)" data-act="ans" data-s="weak">あやしい</button>`:`<button class="btn pri" style="flex:1" data-act="reveal">答えを見る</button>`}<button class="btn" data-act="quizEnd">中断</button></div>`;
}
function renderSettings(){
  return `<div class="card"><h3>テスト・診断</h3><div class="bar"><button class="btn pri" data-act="diag">自己診断を実行</button><button class="btn" data-act="weak5">5件を「あやしい」に</button><button class="btn" data-act="tplus" data-n="1">日付 +1日</button><button class="btn" data-act="tplus" data-n="7">+7日</button><button class="btn" data-act="tplus" data-n="0">日付を戻す</button><button class="btn weak" data-act="reset">この端末のデータを初期化</button></div><p class="muted">日付のずれ：${offDays()}日（間隔反復のテスト用）。URLの末尾に ?diag を付けて開くと、起動時に自動で診断します。</p></div>
  <div class="card"><h3>バックアップ（${items().length}件）</h3><div class="bar"><button class="btn" data-act="export">書き出し（JSON）</button><label class="btn" style="margin:0;color:var(--tx);font-size:16px">読み込み<input type="file" id="imp" accept="application/json,.json" hidden></label></div><p class="muted">読み込みは上書きではなく、更新が新しい方を残して統合します。</p></div>
  <div class="card"><h3>クラウド同期（GitHub Gist・無料）</h3><label>GitHubトークン（gist権限のみ）</label><input id="g-token" type="password" value="${esc(gist.token||'')}" autocomplete="off"><label>Gist ID（2台目以降は、1台目に表示されたIDを入力）</label><input id="g-id" value="${esc(gist.id||'')}" autocapitalize="off"><div class="bar"><button class="btn pri" data-act="gsave">保存して同期</button><button class="btn" data-act="gsync">今すぐ同期</button><button class="btn" data-act="gclear">この端末の同期を解除</button></div><p class="muted">最終同期：${gist.last?new Date(gist.last).toLocaleString('ja-JP'):'未同期'}${lastErr?'<br><span class="weak">直近のエラー：'+esc(lastErr)+'</span>':''}</p></div>
  <div class="card"><h3>サンプル</h3><div class="bar"><button class="btn" data-act="restore">削除したサンプルを復元・最新化</button></div></div>
  <p class="muted">アプリ ${VERSION}</p>`;
}

function openDetail(id){
  const it=state.items[id];if(!it)return;const s=st(id);
  const sec=(t,v)=>v?`<div class="card"><h3>${t}</h3>${v}</div>`:'';
  const same=it.group?items().filter(x=>x.group===it.group&&x.id!==id):[];
  const sb=(v,l)=>`<button class="btn ${s===v?'pri':''}" data-act="status" data-s="${v}" data-id="${esc(id)}">${l}</button>`;
  const k=ctx.indexOf(id),prev=k>0?ctx[k-1]:null,next=k>=0&&k<ctx.length-1?ctx[k+1]:null;
  openSheet(`<div class="bar"><button class="btn" data-act="close">← 戻る</button><span style="flex:1"></span>${prev?`<button class="btn" data-act="go" data-id="${esc(prev)}">‹ 前</button>`:''}${k>=0?`<span class="muted" style="align-self:center">${k+1}/${ctx.length}</span>`:''}${next?`<button class="btn" data-act="go" data-id="${esc(next)}">次 ›</button>`:''}</div>
  <div class="big">${esc(it.phrase)}</div><div>${nl(it.meaning)}</div>
  <div class="bar">${sb('ok','覚えた')}${sb('weak','あやしい')}${sb('new','未学習')}</div>
  ${sec('前置詞・語のイメージ',nl(it.image))}${sec('なりたち',nl(it.origin))}${sec('例文',(it.examples||[]).map(e=>`<p>${esc(e)}</p>`).join(''))}${sec('注意点（ひっかけ）',nl(it.pitfalls))}
  ${same.length?`<div class="card"><h3>比較：${esc(it.group)}</h3>${same.map(x=>row(x)).join('')}</div>`:''}
  <div class="card"><h3>辞書で確認</h3>${lookupLinks(it.phrase)}</div>

}

function saveItem(id){
  const v=k=>$('#f-'+k).value.trim();const phrase=v('phrase'),meaning=v('meaning');
  if(!phrase||!meaning)return toast('イディオムと意味は必須です');
  if(!id){const dup=items().find(i=>norm(i.phrase)===norm(phrase));
    if(dup&&!confirm('同じイディオムが登録済みです。それでも追加しますか？'))return openDetail(dup.id);
    id='u-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
  const old=state.items[id]||{};
  state.items[id]={...old,id,phrase,meaning,image:v('image'),origin:v('origin'),examples:v('examples').split('\n').map(s=>s.trim()).filter(Boolean),pitfalls:v('pitfalls'),tags:v('tags').split(/[,、]/).map(s=>s.trim()).filter(Boolean),group:v('group'),folder:old.folder||'my',updatedAt:now()};
  delete state.deleted[id];save();toast('保存しました');openDetail(id);
}
function fillJson(){
  const m=$('#f-json').value.match(/\{[\s\S]*\}/);if(!m)return toast('JSONが見つかりません');
  try{const o=JSON.parse(m[0]);
    for(const k of['phrase','meaning','image','origin','pitfalls','group'])if(o[k]!=null)$('#f-'+k).value=o[k];
    if(o.examples)$('#f-examples').value=[].concat(o.examples).join('\n');
    if(o.tags)$('#f-tags').value=[].concat(o.tags).join(', ');
    toast('反映しました。確認して保存してください')}catch(e){toast('JSONの形式が正しくありません')}
}

}

{"phrase":"見出し形","meaning":"日本語の意味（複数あればすべて）","image":"前置詞や核となる語のイメージと、なぜその前置詞なのか","origin":"語源・なりたち","examples":["ビジネス場面の英文（和訳）","Part 5風の英文（和訳）"],"pitfalls":"TOEICでのひっかけ・間違えやすい点（似た表現との違い、後ろに来る品詞など）","tags":["Part5"],"group":"比較用のグループ名（例: 条件、時間、理由）"}`;

function startQuiz(mode,dir){
  const a=items();let pool;
  if(mode==='today')pool=[...shuf(a.filter(i=>st(i.id)==='weak')),...shuf(a.filter(i=>st(i.id)==='ok'&&due(i.id))),...shuf(a.filter(i=>st(i.id)==='new'))];
  else pool=shuf(a.filter(i=>mode==='weak'?st(i.id)==='weak':mode==='new'?st(i.id)==='new':true));
  if(!pool.length)return toast('出題できるものがありません');
  quiz={q:shuf(pool.slice(0,20)).map(i=>i.id),i:0,shown:false,dir,okN:0,weakN:0};tab='quiz';closeSheet();
}

async function doExport(){
  const name=`toeic-idioms-${new Date().toISOString().slice(0,10)}.json`;
  const file=new File([JSON.stringify(exportData(),null,1)],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
function merge(r){
  for(const[id,it]of Object.entries(r.items||{})){const l=state.items[id];if(!l||(it.updatedAt||0)>(l.updatedAt||0))state.items[id]=it}
  for(const[id,s]of Object.entries(r.status||{})){const l=state.status[id];if(!l||(s.t||0)>(l.t||0))state.status[id]=s}
  for(const[id,t]of Object.entries(r.deleted||{}))if(!state.deleted[id]||t>state.deleted[id])state.deleted[id]=t;
  for(const[id,t]of Object.entries(state.deleted)){const it=state.items[id];if(it&&(it.updatedAt||0)<=t)delete state.items[id]}
}
async function doImport(f){try{const o=JSON.parse(await f.text());if(!o.items)throw 0;merge(o);save();toast('統合しました');render()}catch(e){toast('読み込めませんでした（形式が違います）')}}

async function diag(){
  const R=[];const t=(n,ok,info='')=>R.push([n,!!ok,info]);
  try{t('サンプル件数',SAMPLE.length===45,SAMPLE.length+'件')}catch(e){t('サンプル件数',false,e.message)}
  t('サンプルID重複なし',new Set(SAMPLE.map(s=>s.id)).size===SAMPLE.length);
  t('検索：fog → due to（例文検索）',search('fog').some(i=>i.phrase==='due to'));
  t('検索：日本語「条件」',search('条件').length>0,search('条件').length+'件');
  const bad=SAMPLE.filter(s=>!cloze(s)).map(s=>s.phrase);t('穴埋めの生成（全サンプル）',!bad.length,bad.length?'失敗: '+bad.join(', '):'45/45');
  const gc=groups().filter(g=>items().filter(i=>i.group===g).length>1).length;t('比較グループ（2件以上）',gc>=5,gc+'組');
  const snap=JSON.stringify(state);merge(JSON.parse(snap));t('統合処理（同じデータで変化なし）',JSON.stringify(state)===snap);
  try{localStorage.setItem('tir-t','1');localStorage.removeItem('tir-t');t('端末への保存',true)}catch(e){t('端末への保存',false,e.message)}
  t('ホーム画面から起動',navigator.standalone||matchMedia('(display-mode: standalone)').matches,'Safariで開いている場合は×で正常');
  let reg=null;try{reg=navigator.serviceWorker?await navigator.serviceWorker.getRegistration():null}catch(e){}
  t('オフライン対応（Service Worker）',!!reg,location.protocol==='https:'?'':'httpsで開く必要があります');
  let ps=false;try{ps=navigator.storage&&navigator.storage.persisted?await navigator.storage.persisted():false}catch(e){}
  t('データ消去されにくい設定',ps,'×でも動作します');
  t('発音の読み上げ',!!window.speechSynthesis);
  t('共有シートで書き出し',!!navigator.canShare);
  t('オンライン',navigator.onLine);
  t('クラウド同期',gist.token&&!lastErr,gist.token?(lastErr||'OK'):'未設定（任意）');
  t('実行時エラーなし',!window.__errs.length,window.__errs.slice(-3).join(' / '));
  const ok=R.filter(r=>r[1]).length;
  window.__diag=`診断 ${VERSION} ${new Date().toLocaleString('ja-JP')}\n日付ずれ ${offDays()}日 / 登録 ${items().length}件 / 今日の復習 ${dueCount()}件\n${navigator.userAgent}\n`+R.map(r=>(r[1]?'✅ ':'❌ ')+r[0]+(r[2]?'（'+r[2]+'）':'')).join('\n');
  openSheet(`<div class="bar"><button class="btn" data-act="close">閉じる</button><button class="btn pri" data-act="copyDiag">結果をコピー</button><button class="btn" data-act="diag">再実行</button></div><div class="big">${ok} / ${R.length} OK</div>`+R.map(r=>`<div class="row"><span>${r[1]?'✅':'❌'} ${esc(r[0])}${r[2]?`<small>${esc(r[2])}</small>`:''}</span></div>`).join('')+`<p class="muted">「結果をコピー」してチャットに貼れば、そのまま修正に使えます。</p>`);
}

function syncUI(text,err){const b=$('#sync');if(!gist.token){b.hidden=true;return}b.hidden=false;b.textContent=text;b.classList.toggle('err',!!err)}
function idleSyncUI(){if(!gist.token)return syncUI();if(!navigator.onLine)return syncUI('オフライン',true);if(lastErr)return syncUI('⚠ 同期失敗',true);syncUI(gist.last?'✓ '+new Date(gist.last).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):'未同期')}
function scheduleSync(){if(!gist.token)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>sync(true),4000)}
async function sync(quiet){
  if(!gist.token||syncing)return;
  if(!navigator.onLine){idleSyncUI();if(!quiet)toast('オフラインのため同期できません');return}
  syncing=true;syncUI('同期中…');
  const h={Authorization:'Bearer '+gist.token,Accept:'application/vnd.github+json'};
  try{
    if(gist.id){const r=await fetch(GH+'/'+gist.id,{headers:h,cache:'no-store'});
      if(!r.ok)throw new Error(r.status===404?'Gistが見つかりません（IDを確認してください）':r.status===401?'トークンが無効か期限切れです':'取得に失敗しました（'+r.status+'）');
      const f=(await r.json()).files?.[FILE];
      if(f){const txt=f.truncated?await(await fetch(f.raw_url)).text():f.content;merge(JSON.parse(txt));localStorage.setItem(KEY,JSON.stringify(state))}}
    const body={files:{[FILE]:{content:JSON.stringify(exportData())}}};
    if(!gist.id){body.description='TOEIC idiom review data';body.public=false}
    const r2=await fetch(gist.id?GH+'/'+gist.id:GH,{method:gist.id?'PATCH':'POST',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r2.ok)throw new Error(r2.status===401?'トークンが無効か期限切れです':(r2.status===403||r2.status===404)?'トークンにgist権限がありません':'保存に失敗しました（'+r2.status+'）');
    gist.id=(await r2.json()).id;gist.last=Date.now();lastErr='';localStorage.setItem(GKEY,JSON.stringify(gist));
    if(!quiet)toast('同期しました');if(!$('#sheet').classList.contains('open')&&!quiz)render();
  }catch(e){lastErr=e.message||'通信エラー';if(!quiet)toast('同期できません：'+lastErr)}
  finally{syncing=false;idleSyncUI()}
}

$('#q').addEventListener('input',()=>{tab='search';if($('#sheet').classList.contains('open'))$('#sheet').classList.remove('open');render()});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur()});
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act],[data-id],[data-tab]');if(!a)return;const d=a.dataset;
  if(d.tab){tab=d.tab;closeSheet();return}
  if(!d.act){openDetail(d.id);return}
  const A={
    close:closeSheet,go:()=>openDetail(d.id),new:()=>openEdit(null,d.q||''),edit:()=>openEdit(d.id),saveItem:()=>saveItem(d.id),fillJson,prompt:()=>copyPrompt(d.q),
    status:()=>{setStatus(d.id,d.s);openDetail(d.id)},
    del:()=>{if(confirm('削除しますか？')){delete state.items[d.id];state.deleted[d.id]=now();save();closeSheet()}},
    speak:()=>{const u=new SpeechSynthesisUtterance(d.q.replace(/-ing/g,'').replace(/ A /g,' something '));u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)},
    quiz:()=>startQuiz(d.mode,d.dir||$('#qdir')?.value||'en'),reveal:()=>{quiz.shown=true;render()},
    ans:()=>{setStatus(quiz.q[quiz.i],d.s);quiz[d.s+'N']++;quiz.i++;quiz.shown=false;render()},
    quizEnd:()=>{quiz=null;render()},export:doExport,
    diag:()=>{$('#errbar').hidden=true;diag()},
    copyDiag:()=>copyText(window.__diag||'','診断結果をコピーしました。チャットに貼ってください'),
    tplus:()=>{const n=+d.n;localStorage.setItem(OFF,n?offDays()+n:0);toast(n?'日付を'+offDays()+'日進めました':'日付を戻しました');render()},
    weak5:()=>{items().slice(0,5).forEach(i=>setStatus(i.id,'weak'));toast('5件を「あやしい」にしました');render()},
    reset:()=>{if(confirm('この端末の学習データと設定をすべて消して初期状態に戻します。よろしいですか？（Gist上のデータは消えません）')){[KEY,OFF,GKEY].forEach(k=>localStorage.removeItem(k));location.reload()}},
    gsave:()=>{gist.token=$('#g-token').value.trim();gist.id=$('#g-id').value.trim();localStorage.setItem(GKEY,JSON.stringify(gist));sync(false)},
    gsync:()=>sync(false),
    syncInfo:()=>{if(lastErr)toast(lastErr+'（再同期します）');sync(false)},
    gclear:()=>{if(confirm('この端末の同期設定を消しますか？（データは残ります）')){gist={};lastErr='';localStorage.removeItem(GKEY);idleSyncUI();render()}},
    restore:()=>{let n=0;for(const s of SAMPLE){const cur=state.items[s.id];if(state.deleted[s.id]||!cur||(cur.folder==='sample'&&!cur.updatedAt)){delete state.deleted[s.id];state.items[s.id]={...s,folder:'sample',updatedAt:now()};n++}}save();toast(n+'件復元・最新化しました');render()}
  };A[d.act]?.();
});
document.addEventListener('change',e=>{
  const k=e.target.dataset.filter;
  if(k){listFilter[k]=e.target.type==='checkbox'?e.target.checked:e.target.value;render()}
  if(e.target.id==='imp'&&e.target.files[0])doImport(e.target.files[0]);
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync(true)});
window.addEventListener('online',()=>sync(true));window.addEventListener('offline',idleSyncUI);

load();render();idleSyncUI();sync(true);
if(location.search.includes('diag'))setTimeout(diag,800);
navigator.storage?.persist?.();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(e=>window.__errs.push('SW: '+e.message));
</script>
